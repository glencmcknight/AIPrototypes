<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNAKE // terminal prototype</title>
<style>
  :root{
    --bg: #0c0c0e;
    --panel: #151316;
    --grid-line: #2a1620;
    --phosphor: #ff1f6d;
    --phosphor-dim: #7a1338;
    --phosphor-bright: #fff200;
    --amber: #fff200;
    --danger: #ff2b2b;
    --font-mono: 'Courier New', ui-monospace, Menlo, Consolas, monospace;
    --font-punk: 'Arial Black', 'Impact', Haettenschweiler, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body{
    margin:0; padding:0; background: var(--bg); color: var(--phosphor);
    font-family: var(--font-mono); min-height: 100%;
    display:flex; align-items:center; justify-content:center;
  }
  .terminal{
    position:relative; width: 620px; max-width: 94vw;
    padding: 22px 24px 26px; background: var(--panel);
    border: 1px solid var(--phosphor-dim); border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255,31,109,0.08), 0 0 40px rgba(255,31,109,0.12), inset 0 0 60px rgba(0,0,0,0.6);
  }
  .terminal::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px);
    border-radius: 4px; mix-blend-mode: multiply;
  }
  h1{ margin: 0 0 2px; font-family: var(--font-punk); font-size: 26px; letter-spacing: 0.06em; color: var(--phosphor-bright); text-shadow: 2px 2px 0 var(--phosphor), -1px -1px 0 rgba(0,0,0,0.6); transform: skew(-4deg); }
  .subtitle{ font-size: 11px; color: var(--phosphor-dim); margin-bottom: 16px; letter-spacing: 0.04em; }
  .hud{ display:flex; justify-content:space-between; align-items:center; font-size: 13px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--grid-line); }
  .hud span.label{ color: var(--phosphor-dim); }
  .hud span.value{ color: var(--phosphor-bright); }
  #best.value{ color: var(--amber); }
  .score-block{ display:flex; flex-direction:column; align-items:center; gap: 2px; }
  .score-block .label{ font-size: 10px; }
  .score-value{
    font-family: var(--font-punk); font-size: 32px; line-height:1; color: var(--phosphor-bright);
    text-shadow: 2px 2px 0 var(--phosphor), -1px -1px 0 rgba(0,0,0,0.6); transform: skew(-4deg);
  }
  canvas{
    display:block; width: 100%; aspect-ratio: 1 / 1;
    background-color: #060906;
    border: 1px solid var(--grid-line); border-radius: 2px; image-rendering: pixelated;
  }
  .footline{ display:flex; justify-content:space-between; margin-top: 12px; font-size: 11px; color: var(--phosphor-dim); letter-spacing: 0.03em; }
  .overlay{
    position:absolute; inset: 0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap: 10px; background: rgba(6,9,6,0.86); border-radius: 4px; text-align:center; padding: 20px;
  }
  .overlay.show{ display:flex; }
  .overlay h2{
    margin:0; font-family: var(--font-punk); font-size: 24px; letter-spacing:0.06em; color: var(--danger);
    text-shadow: 2px 2px 0 var(--phosphor-dim), -1px -1px 0 rgba(0,0,0,0.6); transform: skew(-4deg);
  }
  .overlay.start h2{ color: var(--phosphor-bright); text-shadow: 2px 2px 0 var(--phosphor), -1px -1px 0 rgba(0,0,0,0.6); }
  .overlay p{ margin:0; font-size: 12px; color: var(--phosphor-dim); max-width: 320px; line-height:1.6; }
  .key{ display:inline-block; border: 1px solid var(--phosphor-dim); border-radius: 3px; padding: 1px 6px; color: var(--phosphor-bright); font-size: 11px; }
  button.go{
    margin-top: 6px; background: transparent; border: 1px solid var(--phosphor); color: var(--phosphor-bright);
    font-family: var(--font-mono); letter-spacing: 0.08em; font-size: 12px; padding: 8px 18px; border-radius: 3px; cursor: pointer; text-transform: uppercase;
  }
  button.go:hover{ background: rgba(255,31,109,0.15); box-shadow: 0 0 12px rgba(255,31,109,0.35); }
  @media (max-width: 480px){ h1{ font-size:18px; } .hud{ font-size: 12px; } }
</style>
</head>
<body>

<div class="terminal">
  <h1>SNAKE</h1>
  <div class="subtitle">a small, honest game loop &mdash; for learning, not shipping</div>

  <div class="hud">
    <div><span class="label">BEST </span><span class="value" id="best">0</span></div>
    <div class="score-block"><span class="label">SCORE</span><span class="score-value" id="score">0</span></div>
    <div><span class="label">SPEED </span><span class="value" id="speed">1.0x</span></div>
  </div>

  <div style="position:relative;">
    <canvas id="board" width="392" height="392"></canvas>

    <div class="overlay start show" id="startOverlay">
      <h2>READY</h2>
      <p>Arrow keys or <span class="key">WASD</span> to move.<br>Eat the amber dot. Don't hit yourself or the wall.</p>
      <button class="go" id="startBtn">Start Run</button>
    </div>

    <div class="overlay" id="deathOverlay">
      <h2>RUN ENDED</h2>
      <p id="deathReason">You collided with something.</p>
      <button class="go" id="retryBtn">Try Again</button>
    </div>
  </div>

  <div class="footline">
    <span>Grid: <span id="gridInfo">14&times;14</span></span>
    <span>Pause: <span class="key">SPACE</span></span>
  </div>
</div>

<script>
/* =========================================================================
   SNAKE - a deliberately over-commented reference implementation.

   Why over-commented? Because the point of this file isn't just "a game,"
   it's a map you can hold up against Godot / Unity / Unreal later and go
   "oh, THIS part is _process(), THIS part is an input map, THIS part is
   a collision check." The vocabulary changes between engines; the shape
   of the problem does not.

   Five systems, present in nearly every 2D game you'll ever prototype:
     1. CONFIG    - tunable numbers, kept separate from logic
     2. STATE     - the data that fully describes "what's happening now"
     3. INPUT     - reading intent, decoupled from actually moving
     4. UPDATE    - turning input + time into new state (the game loop)
     5. RENDER    - drawing the current state, and only the current state
   ========================================================================= */

// ---- 1. CONFIG -----------------------------------------------------------
const GRID_SIZE      = 20;
const CELL           = 28;
const START_LENGTH   = 3;
const BASE_TICK_MS   = 140;
const SPEEDUP_EVERY  = 5;
const SPEEDUP_FACTOR = 0.92;
const MIN_TICK_MS    = 60;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = GRID_SIZE * CELL;
canvas.height = GRID_SIZE * CELL;
document.getElementById('gridInfo').textContent = GRID_SIZE + '\u00d7' + GRID_SIZE;

const rootStyle = getComputedStyle(document.documentElement);
const GRID_LINE_COLOR = rootStyle.getPropertyValue('--grid-line').trim();
const SNAKE_HEAD_COLOR = rootStyle.getPropertyValue('--phosphor-bright').trim();
const SNAKE_BODY_COLOR = rootStyle.getPropertyValue('--phosphor').trim();
const FOOD_COLOR = rootStyle.getPropertyValue('--amber').trim();

function withAlpha(hexColor, alpha){
  const hex = hexColor.replace('#', '');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const speedEl = document.getElementById('speed');
const startOverlay = document.getElementById('startOverlay');
const deathOverlay = document.getElementById('deathOverlay');
const deathReason  = document.getElementById('deathReason');

let best = 0;

// ---- 2. STATE --------------------------------------------------------------
let state = null;

function makeInitialState(){
  const mid = Math.floor(GRID_SIZE / 2);
  const snake = [];
  for (let i = 0; i < START_LENGTH; i++){
    snake.push({ x: mid - i, y: mid });
  }
  return {
    snake,
    dir: { x: 1, y: 0 },
    queuedDir: { x: 1, y: 0 },
    food: spawnFood(snake),
    score: 0,
    tickMs: BASE_TICK_MS,
    running: false,
    gameOver: false,
    paused: false,
  };
}

function spawnFood(snake){
  while (true){
    const candidate = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE),
    };
    const collides = snake.some(function(seg){ return seg.x === candidate.x && seg.y === candidate.y; });
    if (!collides) return candidate;
  }
}

// ---- AUDIO (synthesized SFX, no external files) --------------------------
let audioCtx = null;

function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// A tanh waveshaper is a cheap, convincing stand-in for the fuzz/distortion
// pedals that give punk guitar its snarl.
function makeDistortion(amount){
  const ctxA = getAudioCtx();
  const shaper = ctxA.createWaveShaper();
  const n = 4096;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const x = (i * 2) / n - 1;
    curve[i] = Math.tanh(x * amount);
  }
  shaper.curve = curve;
  shaper.oversample = '4x';
  return shaper;
}

function playTone(freq, duration, opts){
  opts = opts || {};
  const ctxA = getAudioCtx();
  const now = ctxA.currentTime;
  const osc = ctxA.createOscillator();
  const gain = ctxA.createGain();

  osc.type = opts.type || 'square';
  osc.frequency.setValueAtTime(freq, now);
  if (opts.glideTo){
    osc.frequency.exponentialRampToValueAtTime(opts.glideTo, now + duration);
  }

  const peak = opts.gain != null ? opts.gain : 0.2;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(peak, now + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  if (opts.distort){
    const shaper = makeDistortion(opts.distort);
    osc.connect(shaper);
    shaper.connect(gain);
  } else {
    osc.connect(gain);
  }
  gain.connect(ctxA.destination);

  osc.start(now);
  osc.stop(now + duration + 0.02);
}

function playNoiseBurst(duration, opts){
  opts = opts || {};
  const ctxA = getAudioCtx();
  const now = ctxA.currentTime;
  const bufferSize = Math.floor(ctxA.sampleRate * duration);
  const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++){
    data[i] = Math.random() * 2 - 1;
  }

  const src = ctxA.createBufferSource();
  src.buffer = buffer;

  const filter = ctxA.createBiquadFilter();
  filter.type = opts.filterType || 'lowpass';
  filter.frequency.setValueAtTime(opts.filterFreqStart || 4000, now);
  if (opts.filterFreqEnd != null){
    filter.frequency.exponentialRampToValueAtTime(opts.filterFreqEnd, now + duration);
  }

  const gain = ctxA.createGain();
  const peak = opts.gain != null ? opts.gain : 0.3;
  gain.gain.setValueAtTime(peak, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctxA.destination);

  src.start(now);
  src.stop(now + duration + 0.02);
}

function playMoveSfx(){
  playTone(160 + Math.random() * 40, 0.035, { type: 'square', gain: 0.05 });
}

function playEatSfx(){
  // bright ascending triad (C5-E5-A5), each note punchier than the last
  const notes = [523.25, 659.25, 880];
  notes.forEach(function(freq, i){
    setTimeout(function(){
      playTone(freq, 0.09, { type: 'square', gain: 0.16 + i * 0.04, distort: 5 });
    }, i * 55);
  });
  // high shimmer on top for extra sparkle
  setTimeout(function(){
    playNoiseBurst(0.1, { gain: 0.12, filterType: 'highpass', filterFreqStart: 6000, filterFreqEnd: 9000 });
  }, 150);
}

function playStartSfx(){
  playTone(110,    0.25, { type: 'sawtooth', gain: 0.22, distort: 6 });
  playTone(164.81, 0.25, { type: 'sawtooth', gain: 0.16, distort: 6 });
}

function playDeathSfx(){
  playNoiseBurst(0.4, { gain: 0.28, filterFreqStart: 3500, filterFreqEnd: 200 });

  // extended 3-note descending "sad trombone" failure motif, each note
  // sagging further downward as it decays
  const notes = [220, 174.61, 110];
  notes.forEach(function(freq, i){
    setTimeout(function(){
      playTone(freq, 0.32, { type: 'sawtooth', gain: 0.22, distort: 8, glideTo: freq * 0.7 });
    }, i * 170);
  });
}

// ---- 3. INPUT ----------------------------------------------------------
const DIRS = {
  ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 },
  ArrowDown:  { x: 0, y: 1 },  s: { x: 0, y: 1 },
  ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 },  d: { x: 1, y: 0 },
};

window.addEventListener('keydown', function(e){
  if (e.key === ' '){
    e.preventDefault();
    togglePause();
    return;
  }
  const wanted = DIRS[e.key] || DIRS[e.key.toLowerCase()];
  if (!wanted || !state || !state.running || state.paused) return;

  const isReversal = wanted.x === -state.dir.x && wanted.y === -state.dir.y;
  if (!isReversal){
    state.queuedDir = wanted;
    e.preventDefault();
  }
});

function togglePause(){
  if (!state || !state.running || state.gameOver) return;
  state.paused = !state.paused;
}

// ---- 4. UPDATE (the game loop) -----------------------------------------
let tickHandle = null;

function scheduleNextTick(){
  clearTimeout(tickHandle);
  tickHandle = setTimeout(gameTick, state.tickMs);
}

function gameTick(){
  if (!state.running || state.gameOver){ return; }
  if (state.paused){ scheduleNextTick(); return; }

  state.dir = state.queuedDir;

  const head = state.snake[0];
  const newHead = { x: head.x + state.dir.x, y: head.y + state.dir.y };

  const hitWall = newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE;
  const hitSelf = state.snake.some(function(seg){ return seg.x === newHead.x && seg.y === newHead.y; });

  if (hitWall || hitSelf){
    endGame(hitWall ? 'You ran into the wall.' : 'You ran into your own tail.');
    return;
  }

  state.snake.unshift(newHead);

  const ateFood = newHead.x === state.food.x && newHead.y === state.food.y;
  if (ateFood){
    state.score += 1;
    scoreEl.textContent = state.score;
    state.food = spawnFood(state.snake);
    playEatSfx();

    if (state.score % SPEEDUP_EVERY === 0){
      state.tickMs = Math.max(MIN_TICK_MS, Math.round(state.tickMs * SPEEDUP_FACTOR));
      speedEl.textContent = (BASE_TICK_MS / state.tickMs).toFixed(1) + 'x';
    }
  } else {
    state.snake.pop();
    playMoveSfx();
  }

  scheduleNextTick();
}

function endGame(reason){
  state.running = false;
  state.gameOver = true;
  best = Math.max(best, state.score);
  bestEl.textContent = best;
  deathReason.textContent = reason;
  deathOverlay.classList.add('show');
  playDeathSfx();
}

function startRun(){
  state = makeInitialState();
  state.running = true;
  scoreEl.textContent = 0;
  speedEl.textContent = '1.0x';
  startOverlay.classList.remove('show');
  deathOverlay.classList.remove('show');
  playStartSfx();
  scheduleNextTick();
  requestAnimationFrame(renderLoop);
}

document.getElementById('startBtn').addEventListener('click', startRun);
document.getElementById('retryBtn').addEventListener('click', startRun);

// ---- 5. RENDER -----------------------------------------------------------
function renderLoop(){
  draw();
  if (state && state.running){
    requestAnimationFrame(renderLoop);
  }
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  if (!state) return;

  drawCell(state.food.x, state.food.y, FOOD_COLOR, true);

  state.snake.forEach(function(seg, i){
    const isHead = i === 0;
    const t = i / Math.max(1, state.snake.length - 1);
    const alpha = 1 - t * 0.55;
    const color = isHead ? SNAKE_HEAD_COLOR : withAlpha(SNAKE_BODY_COLOR, alpha);
    drawCell(seg.x, seg.y, color, false);
  });
}

function drawGrid(){
  ctx.strokeStyle = GRID_LINE_COLOR;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= GRID_SIZE; i++){
    const p = i * CELL + 0.5;
    ctx.moveTo(p, 0);
    ctx.lineTo(p, canvas.height);
    ctx.moveTo(0, p);
    ctx.lineTo(canvas.width, p);
  }
  ctx.stroke();
}

function drawCell(gx, gy, color, glow){
  const x = gx * CELL, y = gy * CELL;
  ctx.fillStyle = color;
  if (glow){
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
  } else {
    ctx.shadowBlur = 0;
  }
  const pad = 2;
  ctx.fillRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2);
  ctx.shadowBlur = 0;
}

state = makeInitialState();
draw();
</script>
</body>
</html>
